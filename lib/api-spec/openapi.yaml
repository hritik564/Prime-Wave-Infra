openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /investments/single-plan-summary:
    get:
      operationId: getSinglePlanSummary
      tags: [investments]
      summary: Authenticated member SINGLE accounting, excluding legacy investments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative member entitlement account
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/SinglePlanSummary"
        "401":
          description: Authentication required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SinglePlanSummary:
      type: object
      required: [originalCapital, roiAccrued, roiClaimed, roiCompounded, claimableRoi, principalReturned, principalOwed, tier, maxRoi, totalEntitlement, remainingRoi, settlement, qualificationHistory, investmentCount]
      properties:
        originalCapital: { type: string }
        roiAccrued: { type: string }
        roiClaimed: { type: string }
        roiCompounded: { type: string }
        claimableRoi: { type: string }
        principalReturned: { type: string }
        principalOwed: { type: string }
        tier: { type: integer, enum: [3, 5] }
        qualifiedAt: { type: [string, "null"], format: date-time }
        maxRoi: { type: string }
        totalEntitlement: { type: string }
        remainingRoi: { type: string }
        # Retain integer validation while generating builders compatible with workspace Zod 3.
        investmentCount: { type: number, multipleOf: 1, minimum: 0 }
        qualificationHistory:
          type: array
          items:
            type: object
            properties:
              createdAt: { type: string, format: date-time }
              metadata: {}
        settlement:
          type: object
          required: [eligible, reason]
          properties:
            eligible: { type: boolean, enum: [false] }
            reason: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

