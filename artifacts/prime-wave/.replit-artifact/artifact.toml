kind = "web"
previewPath = "/"
title = "Prime Wave Platform"
version = "1.0.0"
id = "artifacts/prime-wave"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23022

[services.development]
run = "pnpm --filter @workspace/prime-wave run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build:prod"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api"

[services.env]
PORT = "23022"
BASE_PATH = "/"